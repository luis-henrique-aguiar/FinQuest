spring:
  datasource:
    url: jdbc:mysql://localhost:3307/finquest_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      poll-interval: 1000ms
      quiet-period: 500ms
    livereload:
      enabled: true
      port: 35729

logging:
  level:
    org.springframework.boot.devtools: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE