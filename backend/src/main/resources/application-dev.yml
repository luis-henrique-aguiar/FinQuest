spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      poll-interval: 1000
      quiet-period: 500
    livereload:
      enabled: true
      port: 35729
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.springframework.boot.devtools: DEBUG