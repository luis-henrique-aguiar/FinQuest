spring:
  application:
    name: FinQuest-API
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finquest_db}
    username: ${MYSQL_USERNAME:finquest_user}
    password: ${MYSQL_PASSWORD:finquest_pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080