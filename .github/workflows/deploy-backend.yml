name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn -B package --file pom.xml -P !local

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update Lambda Function Code
      run: |
        aws lambda update-function-code \
          --function-name finquest-backend \
          --zip-file fileb://target/FinQuest-0.0.1-SNAPSHOT.jar

    - name: Publish Version & Update Alias
      run: |
        NEW_VERSION=$(aws lambda publish-version --function-name finquest-backend --query 'Version' --output text)
        echo "Nova versão publicada: $NEW_VERSION"
        
        aws lambda update-alias \
          --function-name finquest-backend \
          --name prod \
          --function-version $NEW_VERSION